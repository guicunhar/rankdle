# Stack de produção: Postgres + backend (uvicorn) + web (Caddy servindo o
# frontend estático e fazendo proxy da API). HTTPS automático via Let's Encrypt.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Variáveis sensíveis vêm de um arquivo .env ao lado (veja .env.prod.example).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rankdle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: rankdle
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rankdle"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      RANKDLE_DATABASE_URL: postgresql+psycopg://rankdle:${POSTGRES_PASSWORD}@db:5432/rankdle
      RANKDLE_CORS_ORIGINS: '["https://rankdle.xyz"]'
      RANKDLE_JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
    volumes:
      # CSVs reais ficam acessíveis pro import_ranking.py, somente leitura.
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    # start.sh (CMD do Dockerfile) roda `alembic upgrade head` e sobe o uvicorn.
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: https://rankdle.xyz/api/v1
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - caddy_data:/data      # certificados TLS — não apague
      - caddy_config:/config
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
