name: keep-render-awake

# Mantém o backend free do Render acordado batendo no health check.
# Obs: o cron do GitHub Actions pode atrasar alguns minutos e é pausado
# após 60 dias sem commits no repo. Um monitor externo (UptimeRobot,
# cron-job.org) é mais confiável — use este como reserva ou se não quiser
# criar conta em outro serviço.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping health endpoint
        run: curl -fsS --retry 3 --max-time 60 https://api.rankdle.xyz/api/v1/health
